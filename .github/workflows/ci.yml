name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  database:
    name: Database (schema, RLS, RPC)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: fci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGUSER: dev
      PGPASSWORD: dev
      PGDATABASE: fci
      # Any failed statement fails the job. Without this psql reports the
      # error and exits 0, so a broken schema would look like a green build.
      PSQL: psql -v ON_ERROR_STOP=1 -q
      # apply.mjs takes a connection string, not the PG* variables psql uses.
      DATABASE_URL: postgresql://dev:dev@localhost:5432/fci

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: db/package-lock.json

      # For the idempotency check below, which re-applies one file rather than
      # the whole sequence.
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install db tooling
        working-directory: db
        run: npm ci

      # One command, because db/apply.mjs already owns the apply order and the
      # test list. CI used to repeat both as hardcoded steps, which is how
      # db/auth_bridge.sql came to be applied locally but not here: the file was
      # added to apply.mjs and the CI copy was never updated, so auth_smoke.sql
      # ran against a database with no signup trigger and failed with an
      # assertion that named the symptom rather than the cause.
      #
      # --local adds the auth shim, which stands in for Supabase's auth.uid()
      # and auth.users, and creates the unprivileged app_user role the tests
      # need for RLS assertions to mean anything.
      - name: Apply everything and run the suites
        working-directory: db
        run: node apply.mjs --local --tests

      # functions.sql is all CREATE OR REPLACE, so re-applying it to a live
      # database must be safe -- that is how it will be deployed. (schema.sql
      # and policies.sql are NOT idempotent: they build from empty and
      # CREATE POLICY has no IF NOT EXISTS, so neither is re-run here.)
      - name: Re-apply functions and re-test (idempotency)
        run: |
          $PSQL -f db/functions.sql
          $PSQL -f db/tests/rpc_smoke.sql
          $PSQL -f db/tests/request_smoke.sql
          $PSQL -f db/tests/auth_smoke.sql

  ingest:
    name: Ingest worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ingest/package-lock.json

      - run: npm ci
      - run: npm run typecheck

  web:
    name: Web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # Placeholders. The build only needs these to exist -- nothing is
      # contacted at build time, and the anon key is public anyway (it grants
      # nothing without a session, because RLS does the work).
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
        run: npm run build

      - run: npx eslint .
