name: Ingest catalog

# Run by hand from the Actions tab -- there is no schedule, because the Grand
# Archive catalog only changes when a set releases.
#
# This exists so the catalog can be populated WITHOUT a terminal. A runner can
# reach both api.gatcg.com and Supabase, so the whole job is a button in the
# browser.
#
# The runner is a per-run choice. A self-hosted runner avoids queueing behind
# GitHub's hosted capacity, which matters most for the image backfill -- ~6,400
# polite downloads, comfortably over an hour.
#
# SECURITY, if this repository is ever made public: self-hosted runners must
# not be used by workflows that anyone can trigger. A pull request from a fork
# would run its own code on your machine. This workflow is workflow_dispatch
# only, so it cannot be triggered by a fork -- keep it that way, and think
# twice before putting `self-hosted` on the push/PR-triggered CI workflow.
#
# Setup, once: Settings -> Secrets and variables -> Actions -> New repository
# secret named DATABASE_URL.
#
# Its value: Supabase dashboard -> green "Connect" button -> Session pooler.
#
# SESSION pooler specifically. Not Transaction pooler (6543), which does not
# keep a session between statements. And not Direct connection
# (db.<ref>.supabase.co), which Supabase serves over IPv6 only without the paid
# IPv4 add-on -- on an IPv4-only runner it does not resolve at all.
#
# preflight.mjs rejects both by name before any work starts.
#
# Runners here may be Windows: every step must be shell-agnostic, which is why
# the checks are Node rather than bash.
#
# That secret can write anything in the database, so it is a repository secret
# rather than anything committed, and it never appears in a log.

on:
  workflow_dispatch:
    inputs:
      command:
        description: What to run
        type: choice
        default: catalog
        options:
          - catalog # card and edition JSON: fast, a few minutes
          - images # image backfill: slow, needs storage configured
          - all
      limit:
        description: For images only — stop after this many (blank = no limit)
        type: string
        required: false
      runner:
        description: Where to run it
        type: choice
        default: self-hosted
        options:
          - self-hosted
          - ubuntu-latest

jobs:
  ingest:
    name: ${{ inputs.command }} on ${{ inputs.runner }}
    # Chosen per run rather than hardcoded: a hardcoded self-hosted job queues
    # forever if the runner is offline, and the only way out is editing YAML.
    runs-on: ${{ inputs.runner }}
    # The image backfill is ~6,400 downloads at a deliberately polite rate.
    timeout-minutes: 120
    defaults:
      run:
        working-directory: ingest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ingest/package-lock.json

      # npm ci wipes node_modules first, which matters more on a self-hosted
      # runner: its workspace persists between runs, so a stale tree would
      # otherwise survive.
      - run: npm ci

      # Node, not shell. These were bash `if` blocks and failed instantly on a
      # self-hosted WINDOWS runner, where PowerShell is the default shell and
      # parsed them as a syntax error. Node behaves the same everywhere.
      - name: Check the connection string
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node preflight.mjs

      - name: Check storage is configured
        if: inputs.command != 'catalog'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node -e "if(!process.env.SUPABASE_URL||!process.env.SUPABASE_SERVICE_ROLE_KEY){console.log('::error::Image backfill needs SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY secrets, and a public card-images bucket.');process.exit(1)}"

      - name: Run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Only consulted by the image backfill. Empty for a catalog run.
          STORAGE_DRIVER: supabase
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx src/cli.ts ${{ inputs.command }} ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }}

      - name: What landed
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node summary.mjs
