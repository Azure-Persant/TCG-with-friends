name: Ingest catalog

# Run by hand from the Actions tab -- there is no schedule, because the Grand
# Archive catalog only changes when a set releases.
#
# This exists so the catalog can be populated WITHOUT a terminal. GitHub's
# runners can reach both api.gatcg.com and Supabase, so the whole job is a
# button in the browser.
#
# Setup, once: Settings -> Secrets and variables -> Actions -> New repository
# secret named DATABASE_URL.
#
# Its value: Supabase dashboard -> green "Connect" button -> Session pooler.
#
# SESSION pooler specifically. Not Transaction pooler (6543), which does not
# keep a session between statements. And not Direct connection, which is
# IPv6-only without the paid IPv4 add-on -- GitHub runners are IPv4-only, so a
# direct URL times out here with nothing useful in the log.
#
# That secret can write anything in the database, so it is a repository secret
# rather than anything committed, and it never appears in a log.

on:
  workflow_dispatch:
    inputs:
      command:
        description: What to run
        type: choice
        default: catalog
        options:
          - catalog # card and edition JSON: fast, a few minutes
          - images # image backfill: slow, needs storage configured
          - all
      limit:
        description: For images only — stop after this many (blank = no limit)
        type: string
        required: false

jobs:
  ingest:
    name: ${{ inputs.command }}
    runs-on: ubuntu-latest
    # The image backfill is ~6,400 downloads at a deliberately polite rate.
    timeout-minutes: 120
    defaults:
      run:
        working-directory: ingest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ingest/package-lock.json

      - run: npm ci

      # Fail with an explanation rather than a stack trace from deep inside
      # config.ts, which is what a missing secret would otherwise produce.
      - name: Check the connection string is configured
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set."
            echo "Add it under Settings -> Secrets and variables -> Actions."
            echo "Value: Supabase dashboard -> Connect button -> Session pooler."
            exit 1
          fi
          case "$DATABASE_URL" in
            *:6543/*)
              echo "::error::That is the transaction pooler (port 6543)."
              echo "Use the Session pooler on 5432 — the ingest needs a real session."
              exit 1 ;;
          esac

      - name: Check storage is configured
        if: inputs.command != 'catalog'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Image backfill needs SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY secrets."
            echo "It also needs a public storage bucket named card-images."
            exit 1
          fi

      - name: Run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Only consulted by the image backfill. Empty for a catalog run.
          STORAGE_DRIVER: supabase
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx src/cli.ts ${{ inputs.command }} ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }}

      - name: What landed
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node summary.mjs
